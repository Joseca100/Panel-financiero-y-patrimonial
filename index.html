    '<b>Fuente:</b> ' + (src||'').split('/').pop() +

};

  document.getElementById('loading').innerHTML = 
    '<div style="color:#f87171;padding:20px;font-size:13px;font-family:monospace">' +
    '<b>PROMISE ERROR:</b><br>' + (e.reason || e) + '</div>';
});

const STORAGE_KEY = "boglehead_dashboard_v5";
const storageAPI = {
  async get() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      console.error("Storage read", e);
      return null;
    }
  },
  async set(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      console.error("Storage write", e);
      return false;
    }
  },
  async clear() {
    try {
      localStorage.removeItem(STORAGE_KEY);
      return true;
    } catch (e) {
      return false;
    }
  }
};

const yearsToFI = (current, monthlyContrib, nominalReturn, inflation, target) => {
  const r = (1 + nominalReturn / 100) / (1 + inflation / 100) - 1;
  const annual = monthlyContrib * 12;
  if (current >= target) return 0;
  if (r === 0) return annual > 0 ? (target - current) / annual : Infinity;
  const denom = current + annual / r;
  if (denom <= 0) return Infinity;
  const ratio = (target + annual / r) / denom;
  if (ratio <= 1) return Infinity;
  return Math.log(ratio) / Math.log(1 + r);
};

// Cuota mensual de un préstamo (PMT)
const pmt = (rate, n, pv) => {
  if (rate === 0) return pv / n;
  return pv * rate * Math.pow(1 + rate, n) / (Math.pow(1 + rate, n) - 1);
};
// Número de períodos para amortizar (NPER) dada cuota y capital
const nper = (rate, payment, pv) => {
  if (rate === 0) return pv / payment;
  if (payment <= pv * rate) return Infinity;
  return Math.log(payment / (payment - pv * rate)) / Math.log(1 + rate);
};
// Intereses totales pagados (cuota * meses - capital)
const totalInterest = (capital, payment, months) => payment * months - capital;

// Escala IRPF sobre plusvalías (España 2025)
function calcTax(gain) {
  if (gain <= 0) return 0;
  const brackets = [[6000, 0.19], [44000, 0.21], [150000, 0.23], [Infinity, 0.28]];
  let tax = 0,
    rem = gain;
  for (const [lim, rate] of brackets) {
    const taxable = Math.min(rem, lim);
    tax += taxable * rate;
    rem -= taxable;
    if (rem <= 0) break;
  }
  return tax;
}

// Simula reembolso FIFO dado fondo e importe bruto deseado
function simulateFIFO(fundKey, grossAmount) {
  const lots = FIFO_LOTS[fundKey];
  const price = FUND_PRICES[fundKey] || 0;
  if (!lots || !price || grossAmount <= 0) return null;
  let unitsNeeded = grossAmount / price;
  let totalGain = 0,
    totalInvested = 0,
    totalUnits = 0;
  const detail = [];
  for (const lot of lots) {
    if (unitsNeeded <= 0) break;
    const u = Math.min(lot.units, unitsNeeded);
    const inv = u * lot.cost;
    const mkt = u * price;
    const gain = mkt - inv;
    detail.push({
      date: lot.date,
      label: lot.label,
      units: u,
      gain
    });
    totalGain += gain;
    totalInvested += inv;
    totalUnits += u;
    unitsNeeded -= u;
  }
  const bruto = totalUnits * price;
  const tax = calcTax(totalGain);
  const neto = bruto - tax;
  return {
    bruto,
    totalGain,
    tax,
    neto,
    totalUnits,
    detail
  };
}

// Totales fiscales por fondo
function fundFiscalSummary(fundKey) {
  const lots = FIFO_LOTS[fundKey];
  const price = FUND_PRICES[fundKey] || 0;
  if (!lots) return null;
  const totalInvested = lots.reduce((a, l) => a + l.invested, 0);
  const totalUnits = lots.reduce((a, l) => a + l.units, 0);
  const totalMarket = totalUnits * price;
  const totalGain = totalMarket - totalInvested;
  const taxIfSold = calcTax(totalGain);
  return {
    totalInvested,
    totalUnits,
    totalMarket,
    totalGain,
    taxIfSold
  };
}
